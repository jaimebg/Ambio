name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lint

      - name: Tests unitarios
        run: ./gradlew test

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Validar la ficha de F-Droid
        run: ./gradlew validateFdroidMetadata

      # F-Droid compila con assembleRelease, no con bundleRelease. Sin este
      # paso la ruta del APK no la prueba nadie hasta que falla en la cola de
      # un maintainer voluntario.
      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build release bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew bundleRelease

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-build
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
          retention-days: 7

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar notas de la release
        run: |
          VERSION_CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          # metadata/ es la ficha publicada para F-Droid y sí se rastrea, así que
          # aquí el changelog existe de verdad. Antes esto miraba en
          # fastlane/metadata/, que está en .gitignore entero porque guarda la
          # clave de servicio de Play: el fichero nunca llegaba al runner y toda
          # release caía en las notas automáticas de gh.
          CHANGELOG_DIR=metadata/en-US/changelogs
          for f in "$CHANGELOG_DIR/$VERSION_CODE.txt" "$CHANGELOG_DIR/default.txt"; do
            if [ -f "$f" ]; then
              echo "versionCode $VERSION_CODE, notas desde $f"
              cp "$f" release-notes.md
              break
            fi
          done
          if [ ! -f release-notes.md ]; then
            echo "versionCode $VERSION_CODE, sin changelog local: las genera gh"
          fi

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotente a propósito: re-empujar una etiqueta vuelve a lanzar este
          # job, y `gh release create` sobre una release existente devuelve
          # HTTP 422 "Release.tag_name already exists" y tumba el build. Pasó al
          # mover v2.0.0 sobre el commit que ya lleva la ficha de F-Droid.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "la release $GITHUB_REF_NAME ya existe: la actualizo"
            if [ -f release-notes.md ]; then
              gh release edit "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" \
                --notes-file release-notes.md
            else
              gh release edit "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME"
            fi
          elif [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
