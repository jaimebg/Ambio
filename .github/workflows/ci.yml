name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew lint

      - name: Tests unitarios
        run: ./gradlew test

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Build release bundle
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew bundleRelease

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-build
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
          retention-days: 7

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar notas de la release
        run: |
          VERSION_CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          CHANGELOG_DIR=fastlane/metadata/android/en-US/changelogs
          # fastlane/ ya no se rastrea, así que aquí el changelog normalmente no
          # existe. Antes esto era un cp a secas y habría tumbado la release.
          for f in "$CHANGELOG_DIR/$VERSION_CODE.txt" "$CHANGELOG_DIR/default.txt"; do
            if [ -f "$f" ]; then
              echo "versionCode $VERSION_CODE, notas desde $f"
              cp "$f" release-notes.md
              break
            fi
          done
          if [ ! -f release-notes.md ]; then
            echo "versionCode $VERSION_CODE, sin changelog local: las genera gh"
          fi

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
